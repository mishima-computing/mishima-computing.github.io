name: Encoding Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-encoding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Encoding Check
        run: python scripts/check_encoding.py
